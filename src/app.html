<!doctype html>
<html lang="en" data-theme="%pokedex.resolved%" style="background:%pokedex.theme-color%;color:%pokedex.ink%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="%pokedex.theme-color%" />
		<meta name="color-scheme" content="%pokedex.color-scheme%" />
		<script>(function(){var stored=null;try{stored=localStorage.getItem("pokedex-theme")}catch(e){}var fromCookie="";var match=document.cookie.match(/(?:^|; )pokedex-theme=([^;]*)/);if(match){try{fromCookie=decodeURIComponent(match[1])}catch(e){fromCookie=""}}function ok(v){return v==="light"||v==="dark"||v==="system"}var choice="system";if(ok(fromCookie)&&fromCookie!=="system")choice=fromCookie;else if(ok(stored))choice=stored;else if(ok(fromCookie))choice=fromCookie;var dark=choice==="dark"||(choice!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);try{if(stored!==choice)localStorage.setItem("pokedex-theme",choice)}catch(e){}var root=document.documentElement;var bg=dark?"#1C1916":"#FBF7F3";var ink=dark?"#F6F1EA":"#171513";root.dataset.theme=dark?"dark":"light";root.style.colorScheme=dark?"dark":"light";root.style.background=bg;root.style.color=ink;var theme=document.querySelector('meta[name="theme-color"]');if(theme)theme.setAttribute("content",bg);var scheme=document.querySelector('meta[name="color-scheme"]');if(scheme)scheme.setAttribute("content",dark?"dark":"light")})();</script>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<!--
			default, not black-translucent. That style draws under the status bar
			but sizes the layout viewport one status-bar height short, anchored at
			the top, so the header sits in the bar and a dead band is left at the
			bottom. iOS reads this when the Home Screen icon is added.
		-->
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Pokedex" />
		%pokedex.startup%
		<style>
			html, body { margin: 0; background: %pokedex.theme-color%; color: %pokedex.ink%; }
			#boot {
				position: fixed;
				inset: 0;
				z-index: 80;
				display: grid;
				place-items: center;
				background: %pokedex.theme-color%;
				color: %pokedex.ink%;
			}
			#boot svg { width: 16vmin; height: 16vmin; display: block; }
			#boot.is-out { opacity: 0; pointer-events: none; }
			html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #boot {
				background: #fbf7f3;
				color: #171513;
			}
			html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #boot {
				background: #1c1916;
				color: #f6f1ea;
			}
			html[data-splash="skip"] #boot { display: none; }
			@media (prefers-reduced-motion: no-preference) {
				#boot { transition: opacity 250ms ease; }
			}
		</style>
		<title>Pokedex</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot" role="status" aria-label="Opening Pokedex">
			<svg viewBox="0 0 128 128" fill="none" aria-hidden="true">
				<g fill="none" stroke="currentColor" stroke-width="4.75" stroke-linecap="round" stroke-linejoin="round">
					<rect x="20" y="24" width="88" height="82" rx="18"/>
					<circle cx="44" cy="48" r="14"/>
					<circle cx="44" cy="48" r="5.5"/>
					<circle cx="70" cy="39" r="3.3" stroke-width="2.6"/>
					<circle cx="81" cy="39" r="3.3" stroke-width="2.6"/>
					<circle cx="92" cy="39" r="3.3" stroke-width="2.6"/>
					<path d="M60 56 H78 V68 H106"/>
				</g>
			</svg>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
