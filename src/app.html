<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FBF7F3" />
		<meta name="color-scheme" content="light" />
		<script src="/theme.js"></script>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<!--
			default, not black-translucent. That style draws under the status bar
			but sizes the layout viewport one status-bar height short, anchored at
			the top, so the header sits in the bar and a dead band is left at the
			bottom. iOS reads this when the Home Screen icon is added.
		-->
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Pokedex" />
		<!--
			Launch images. Light is the default match. The dark link is listed
			second so iOS uses it when the phone is in dark mode. iPhone SE
			(2nd generation) is 750x1334.
		-->
		<link rel="apple-touch-startup-image" href="/icons/startup-750x1334-v4.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-750x1334-dark-v4.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-640x1136-v4.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-640x1136-dark-v4.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1242x2208-v4.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1242x2208-dark-v4.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1125x2436-v4.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1125x2436-dark-v4.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-828x1792-v4.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-828x1792-dark-v4.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1242x2688-v4.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1242x2688-dark-v4.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1170x2532-v4.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1170x2532-dark-v4.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1284x2778-v4.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1284x2778-dark-v4.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1179x2556-v4.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1179x2556-dark-v4.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1290x2796-v4.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="/icons/startup-1290x2796-dark-v4.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<style>
			html, body { margin: 0; background: #fbf7f3; }
			#boot {
				position: fixed;
				inset: 0;
				z-index: 80;
				display: grid;
				place-items: center;
				background: #fbf7f3;
				color: #171513;
			}
			#boot svg { width: 84px; height: 84px; display: block; }
			#boot.is-out { opacity: 0; pointer-events: none; }
			@media (prefers-color-scheme: dark) {
				html, body, #boot { background: #1c1916; color: #f6f1ea; }
			}
			html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #boot {
				background: #fbf7f3;
				color: #171513;
			}
			html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #boot {
				background: #1c1916;
				color: #f6f1ea;
			}
			html[data-splash="skip"] #boot { display: none; }
			@media (prefers-reduced-motion: no-preference) {
				#boot { transition: opacity 280ms ease; }
				#boot svg { animation: boot-mark 700ms ease both; }
			}
			@keyframes boot-mark {
				from { opacity: 0; transform: scale(0.96); }
				to { opacity: 1; transform: none; }
			}
		</style>
		<title>Pokedex</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot" role="status" aria-label="Opening Pokedex">
			<svg viewBox="0 0 128 128" fill="none" aria-hidden="true">
				<g fill="none" stroke="currentColor" stroke-width="4.75" stroke-linecap="round" stroke-linejoin="round">
					<rect x="20" y="24" width="88" height="82" rx="18"/>
					<circle cx="44" cy="48" r="14"/>
					<circle cx="44" cy="48" r="5.5"/>
					<circle cx="70" cy="39" r="3.3" stroke-width="2.6"/>
					<circle cx="81" cy="39" r="3.3" stroke-width="2.6"/>
					<circle cx="92" cy="39" r="3.3" stroke-width="2.6"/>
					<path d="M60 56 H78 V68 H106"/>
				</g>
			</svg>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
